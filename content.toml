# ---------------- papers ----------------
# kind = "working" or "published". Order here = order on the site.

[[papers]]
slug = "knowledge-network-dynamics"
kind = "working"
title = "Innovation and Endogenous Knowledge Network Dynamics"
authors = ["Jie Cai", "Can Tian"]
year = 2024
date = "2024-07"
status = "Working paper, July 2024"
pdf = "knowledge-network-dynamics.pdf"
links = [{ label = "Earlier version (Feb 2023)", url = "knowledge-network-dynamics-2023.pdf" }]
keywords = ["knowledge networks", "innovation", "growth", "patent citations", "link formation"]
abstract = "We study innovation in evolving knowledge networks and its growth implications. Empirically, a new link in the knowledge network is approximated as the first citation between a pair of technology categories. We find that these new links likely connect high-quality innovations and large firms on both ends. After forming a new link, responsible firms’ innovation and real performance improve on both ends with positive spillovers to other firms. We build a tractable model to rationalize these findings and analytically characterize the stationary equilibrium. In the model, the knowledge network evolves endogenously as each firm searches for others as knowledge input suppliers and attracts others as users of its own knowledge. In equilibrium, faster growth is associated with denser and better knowledge networks. Endogenous link formation amplifies the effect of innovation incentives on growth. The calibrated model suggests that the majority of growth in the US has network origins."

[[papers]]
slug = "intermediaries-decentralized-markets"
kind = "working"
title = "Intermediaries in Decentralized Markets: Evidence from Used-Car Transactions"
authors = ["Fei Li", "Charles Murry", "Can Tian", "Yiyi Zhou"]
year = 2025
status = "NBER Working Paper 34136 · revision requested, Journal of Political Economy"
series = "National Bureau of Economic Research"
series_type = "NBER Working Paper"
number = "34136"
doi = "10.3386/w34136"
date = "2025-08"
links = [{ label = "NBER", url = "https://www.nber.org/papers/w34136" }]
keywords = ["intermediaries", "dealers", "search and bargaining", "spatial frictions", "used cars"]
abstract = "We develop and estimate a spatial search-and-bargaining model to study the role of intermediaries and spatial frictions using data from the used-car market. We find that dealers earn price premiums by leveraging three key advantages: selective acquisition of higher-quality cars, superior matching efficiency, and greater bargaining power. Counterfactual simulations reveal that selective intermediation and spatial segmentation significantly affect market efficiency and consumer welfare. While dealers extract more surplus per transaction than sellers, policies reducing dealers' advantages increase search frictions and lower overall welfare. Counterintuitively, reducing spatial frictions harms consumers by shifting trade to less efficient private-seller channels."

[[papers]]
slug = "inventory-management-decentralized-markets"
kind = "published"
title = "Inventory Management in Decentralized Markets"
authors = ["Fei Li", "Charles Murry", "Can Tian", "Yiyi Zhou"]
journal = "International Economic Review"
year = 2024
volume = "65"
issue = "1"
pages = "431-470"
doi = "10.1111/iere.12669"
abstract = "We present a directed search model of intermediaries' dynamic inventory and revenue management. Search frictions hinder instantaneous replenishment, prompting intermediaries to utilize dynamic inventory‐based pricing and ordering strategies. In equilibrium, when inventory is high, an intermediary posts a lower retail price to speed up sales and depresses wholesale price to slow down purchases. We characterize the evolution dynamics of inventory holdings and their steady‐state distribution, and extend the model to multiunit wholesale orders, product differentiation, and heterogeneous intermediaries. Using data from used‐car dealers, we quantitatively evaluate the welfare consequence of used‐car dealers' inventory management practice."

[[papers]]
slug = "learning-firm-dynamics"
kind = "published"
title = "Learning and Firm Dynamics in a Stochastic Equilibrium"
authors = ["Can Tian"]
journal = "Journal of Economic Theory"
year = 2022
volume = "203"
article = "105486"
doi = "10.1016/j.jet.2022.105486"
abstract = "New firms have unknown profitability types, but they learn in the market. With imperfect information, the learning mechanism matters at the firm level and in the aggregate. This paper studies the effect of learning on the distribution of firms, aggregate dynamics, and welfare when firm growth and the entry and exit dynamics are belief-driven. Aggregate uncertainty affects heterogeneous firm beliefs about own types. Faster learning raises firms' continuation values, lowers the selection threshold belief, and thickens the belief distribution's right tail. Aggregate uncertainty lowers firm value by reducing firms' learning speed. Transitory aggregate shocks have persistent impacts on the economy by shifting existing firms' belief updating paths, affecting firm decisions along both intensive and extensive margins. Faster learning improves social welfare."

[[papers]]
slug = "pigouvian-io-linkages"
kind = "published"
title = "Input-Output Linkages in Pigouvian Industrial Fluctuations"
authors = ["Can Tian"]
journal = "Journal of Monetary Economics"
year = 2021
volume = "117"
pages = "1078-1095"
pdf = "pigouvian-io-preprint.pdf"
pdf_label = "Preprint (PDF)"
notes = ["The PDF is the pre-print version."]
doi = "10.1016/j.jmoneco.2020.09.001"
abstract = "Input-output linkages facilitate expectations-driven fluctuations. Signals about yet-to-be-realized aggregate (macro) and idiosyncratic (micro) fundamentals in the future affect current equilibrium outcome through chains of input needs when inputs require time to build. Depending on their importance on these chains, firms respond differently to common signals. The network structure, together with input time to build, determines the magnitude of signal-induced aggregate fluctuations. Macro signals need large input shares on average to produce sizable aggregate volatility, whereas micro signals require cross-sectional variations of input importance. Changing input time to build and altering the network structure have similar effects on equilibrium outcomes."

[[papers]]
slug = "entry-exit-business-cycles"
kind = "published"
title = "Firm-Level Entry and Exit Dynamics over the Business Cycles"
authors = ["Can Tian"]
journal = "European Economic Review"
year = 2018
volume = "102"
pages = "298-326"
links = [{ label = "Earlier version (SSRN)", url = "https://papers.ssrn.com/sol3/papers.cfm?abstract_id=2694275" }]
doi = "10.1016/j.euroecorev.2017.12.011"
abstract = "This paper presents a set of facts on the cyclicality of firm births and deaths in the U.S. during the period 1979–2013. Asymmetry in the cyclicality between firm birth and firm death is observed: aggregate firm birth is generally significantly procyclical, while the (counter-)cyclicality in firm death is ambiguous and sensitive to the choice of cyclical indicator. Such a pattern exists within the majority of sectors as well and is mainly driven by small firms. Young firms are the main contributors to the findings on firm death activity. Further examination along the time-dimension discovers a reason for the contemporaneous cyclicality (or lack thereof) which can be documented as a new fact: firm births positively lead the usual business cycle measures and firm deaths positively lag them. Moreover, cyclicality in business openings and closings differs from establishment level to firm level due to the internal adjustment of continuing firms."

[[papers]]
slug = "riskiness-dispersion-business-cycles"
kind = "published"
title = "Riskiness, Endogenous Productivity Dispersion and Business Cycles"
authors = ["Can Tian"]
journal = "Journal of Economic Dynamics and Control"
year = 2015
volume = "57"
pages = "227-249"
links = [{ label = "Slides", url = "riskiness-slides.pdf" }]
doi = "10.1016/j.jedc.2015.05.015"
abstract = "In the data, cross-sectional productivity dispersion is countercyclical at both the plant level and the firm level, see e.g. Bloom (2009). I incorporate a firm's choice of risk level into a model of firm dynamics with real business cycle features to explain this empirical finding both qualitatively and quantitatively. In the model, in every period, each firm chooses the investment amount and the risk level associated with a production project every period. All projects available to each firm have the same expected flow return, determined by the aggregate and idiosyncratic shocks to the firm's productivity, and differ from one another only in their risk. The endogenous option of exiting the market and the limited funding for new investment jointly play an important role in motivating firms' risk-taking behavior. The model predicts that, in each period, relatively small firms are more likely to take risk and hence exhibit a higher exit rate, and that the cross-sectional productivity dispersion, measured as the standard deviation of the realized individual component of productivity, is larger in recessions."

[[papers]]
slug = "directed-search-job-rotation"
kind = "published"
title = "Directed Search and Job Rotation"
authors = ["Fei Li", "Can Tian"]
journal = "Journal of Economic Theory"
year = 2013
volume = "148"
issue = "3"
pages = "1268-1281"
doi = "10.1016/j.jet.2012.10.004"
abstract = "We consider the impact of job rotation in a directed search model in which firm sizes are endogenously determined and match quality is initially unknown. A large firm benefits from the opportunity to rotate workers so as to partially overcome the loss of mismatch. As a result, in the unique symmetric equilibrium, large firms have higher labor productivity and lower separation rates. In contrast to the standard directed search model with multi-vacancy firms, this model can generate a positive correlation between firm size and wage without introducing any ex ante productivity differences or imposing any non-concave production function assumptions."

